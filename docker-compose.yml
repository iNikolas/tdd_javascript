version: "3.8"

services:
  db:
    image: postgres:19beta1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql

  server:
    image: tdd_javascript/server:latest
    restart: unless-stopped
    environment:
      - PORT=3001
      - CLIENT_URL=http://${VM_PUBLIC_IP}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    depends_on:
      - db

  frontend:
    image: tdd_javascript/frontend:latest
    restart: unless-stopped
    depends_on:
      - server

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - server

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
